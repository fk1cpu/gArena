name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Trigger on every push to main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push to gh-pages branch
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get all history for both branches

      - name: Setup Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to gh-pages
        run: |
          # Fetch the gh-pages branch
          git fetch origin gh-pages:gh-pages
          
          # Create a temporary directory for the build output
          mkdir -p deploy_temp
          
          # Copy all necessary files to deploy_temp
          # Since there's no build step, we copy the root files directly
          cp -r index.html games/ vendor/ assets/ sw.js manifest.json deploy_temp/ 2>/dev/null || true
          
          # Switch to gh-pages branch
          git checkout gh-pages
          
          # Remove old files to ensure clean state
          rm -rf *.html *.js *.json games/ vendor/ assets/ 2>/dev/null || true
          
          # Copy new files from deploy_temp
          cp -r ../deploy_temp/* .
          
          # Clean up temp dir
          cd ..
          rm -rf deploy_temp
          
          # Stage all changes
          git add -A
          
          # Commit only if there are changes
          if git diff --staged --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "chore(deploy): auto-deploy from main @ $(git rev-parse --short HEAD)"
            git push origin gh-pages
            echo "✅ Deployed to gh-pages successfully!"
          fi
